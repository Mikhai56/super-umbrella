name: Bounded Wait Action
description: Wait for a configured number of milliseconds and return the completion time
author: Mikhai56

branding:
  icon: clock
  color: blue

inputs:
  milliseconds:
    description: Delay in milliseconds; use a small positive integer
    required: true
    default: '1000'

outputs:
  time:
    description: Completion time

runs:
  using: node24
  main: dist/index.js
